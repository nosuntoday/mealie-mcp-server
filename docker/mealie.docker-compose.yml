# Example Mealie instance; add the MCP service described in README.md.
services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.30.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9925:9000"
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - mealie-data:/app/data/
volumes:
  mealie-data:
